name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cases
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The API (and so the tests) connect as cases_app, which the migrations create; setup uses the admin role.
      DATABASE_URL: postgres://cases_app:cases_app@localhost:5432/cases
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
